name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Ruff
        run: uvx ruff check --select F401,F811,F841,ARG src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install clang-format and bats
        run: sudo apt-get update && sudo apt-get install -y clang-format bats

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

      - name: Run integration tests
        run: bats tests/integration/test_cli.bats
