[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epita-coding-style"
version = "3.5.0"
description = "EPITA C/C++ Coding Style Checker - validates C and C++ code against EPITA coding standards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hugo" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["c", "c++", "coding-style", "linter", "epita", "checker"]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
epita-coding-style = "epita_coding_style:main"

[project.urls]
Homepage = "https://github.com/KazeTachinuu/epita-coding-style"
Repository = "https://github.com/KazeTachinuu/epita-coding-style"
Issues = "https://github.com/KazeTachinuu/epita-coding-style/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epita_coding_style"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D101", "D102", "D103", "D107",  # docstrings where they add information, not on every definition
    "CPY001",  # license is in LICENSE
    "T201",  # print is the CLI's output
    "TID252",  # relative imports inside the package
    "EM102", "TRY003",  # inline exception messages read better here
    "S603", "S607",  # git/clang-format run with fixed argv from PATH by design
    "COM812",  # conflicts with the formatter
    "PTH",  # the API takes str paths; os.path on str is fine
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"src/epita_coding_style/__init__.py" = ["E402"]
"tests/**" = [
    "S101", "PLR2004", "ANN", "D", "INP001", "FBT", "SLF001", "EM101",
    "ERA001",  # section headers name rules, e.g. `# exp.linebreak`, which reads as code
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"  # "code,expected" is the style used throughout the tests

[tool.mypy]
files = ["src"]
strict = true
