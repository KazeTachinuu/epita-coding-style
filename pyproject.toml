[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epita-coding-style"
version = "3.4.0"
description = "EPITA C/C++ Coding Style Checker - validates C and C++ code against EPITA coding standards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hugo" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["c", "c++", "coding-style", "linter", "epita", "checker"]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
epita-coding-style = "epita_coding_style:main"

[project.urls]
Homepage = "https://github.com/KazeTachinuu/epita-coding-style"
Repository = "https://github.com/KazeTachinuu/epita-coding-style"
Issues = "https://github.com/KazeTachinuu/epita-coding-style/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epita_coding_style"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "PIE", "I", "ARG"]
ignore = ["E501"]
per-file-ignores = { "src/epita_coding_style/__init__.py" = ["E402"] }

[tool.mypy]
files = ["src"]
